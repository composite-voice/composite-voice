[build]
  command = "pnpm run build"
  publish = "dist/"

# Proxy /docs/* to the docs site (composite-voice-docs.netlify.app)
[[redirects]]
  from = "/docs/*"
  to = "https://composite-voice-docs.netlify.app/:splat"
  status = 200
  force = true

# Proxy /design/* to the design system site (composite-voice-design.netlify.app)
[[redirects]]
  from = "/design/*"
  to = "https://composite-voice-design.netlify.app/:splat"
  status = 200
  force = true
