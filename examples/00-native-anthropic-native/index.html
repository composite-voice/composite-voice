<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CompositeVoice — Example 00</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app { width: 100%; max-width: 480px; }

    h1 { font-size: 1.4rem; font-weight: 700; text-align: center; }
    .subtitle { text-align: center; color: #64748b; font-size: 0.85rem; margin: 4px 0 20px; }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 20px;
    }

    /* Status indicator */
    .status { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #334155; flex-shrink: 0; transition: background 0.2s; }
    .status-text { font-size: 0.875rem; color: #94a3b8; }

    [data-state="ready"]     .dot { background: #3b82f6; }
    [data-state="listening"] .dot { background: #f59e0b; animation: pulse 1.4s ease-in-out infinite; }
    [data-state="thinking"]  .dot { background: #8b5cf6; animation: pulse 1.4s ease-in-out infinite; }
    [data-state="speaking"]  .dot { background: #10b981; animation: pulse 1.4s ease-in-out infinite; }
    [data-state="error"]     .dot { background: #ef4444; }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Buttons */
    .controls { display: flex; gap: 8px; margin-bottom: 16px; }
    button {
      flex: 1; padding: 9px 12px; font-size: 0.875rem; font-weight: 600;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
      background: rgba(255,255,255,0.06); color: #e2e8f0;
      cursor: pointer; transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: rgba(255,255,255,0.12); }
    button:disabled { opacity: 0.3; cursor: not-allowed; }
    button.primary { background: rgba(59,130,246,0.4); border-color: rgba(59,130,246,0.6); }
    button.primary:hover:not(:disabled) { background: rgba(59,130,246,0.6); }

    /* Text displays */
    .field { margin-top: 12px; }
    .label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #475569; margin-bottom: 6px; }
    .box {
      background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px; padding: 12px; min-height: 52px;
      font-size: 0.9rem; line-height: 1.6; color: #cbd5e1;
    }
    .placeholder { color: #334155; font-style: italic; }
    .interim     { color: #64748b; font-style: italic; }
    .streaming   { color: #a78bfa; }

    /* Error */
    .error {
      display: none; margin-top: 12px; padding: 10px 14px;
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25);
      border-radius: 8px; font-size: 0.85rem; color: #fca5a5;
    }
    .error.show { display: block; }

    .hint { text-align: center; font-size: 0.75rem; color: #1e293b; margin-top: 10px; }
  </style>
</head>

<body>
  <div class="app">
    <h1>CompositeVoice</h1>
    <p class="subtitle">Example 00 — Native STT · Anthropic · Native TTS</p>

    <div class="card" id="card" data-state="idle">
      <div class="status">
        <div class="dot"></div>
        <span class="status-text" id="status-text">Idle — click Initialize</span>
      </div>

      <div class="controls">
        <button id="btn-init" class="primary">Initialize</button>
        <button id="btn-start" disabled>Start</button>
        <button id="btn-stop"  disabled>Stop</button>
      </div>

      <div class="field">
        <div class="label">You said</div>
        <div class="box" id="transcript"><span class="placeholder">Your speech will appear here…</span></div>
      </div>

      <div class="field">
        <div class="label">AI response</div>
        <div class="box" id="response"><span class="placeholder">The AI response will appear here…</span></div>
      </div>

      <div class="error" id="error"></div>
    </div>

    <p class="hint">Chrome or Edge required &middot; Microphone permission needed</p>
  </div>

  <script type="module">
    import { CompositeVoice, NativeSTT, AnthropicLLM, NativeTTS } from '@lukeocodes/composite-voice';

    // ── Config ─────────────────────────────────────────────────────────────────
    // Copy sample.env → .env and add your Anthropic key (VITE_ANTHROPIC_API_KEY).
    const API_KEY = import.meta.env.VITE_ANTHROPIC_API_KEY;

    // ── UI helpers ─────────────────────────────────────────────────────────────
    const card       = document.getElementById('card');
    const statusText = document.getElementById('status-text');
    const btnInit    = document.getElementById('btn-init');
    const btnStart   = document.getElementById('btn-start');
    const btnStop    = document.getElementById('btn-stop');
    const transcript = document.getElementById('transcript');
    const response   = document.getElementById('response');
    const errorBox   = document.getElementById('error');

    const STATE_LABELS = {
      idle:      'Idle — click Initialize',
      ready:     'Ready — click Start',
      listening: 'Listening…',
      thinking:  'Thinking…',
      speaking:  'Speaking…',
      error:     'Error',
    };

    const setState = (s) => { card.dataset.state = s; statusText.textContent = STATE_LABELS[s] ?? s; };
    const showErr  = (msg) => { errorBox.textContent = msg; errorBox.classList.add('show'); };
    const clearErr = () => errorBox.classList.remove('show');

    // ── Agent ──────────────────────────────────────────────────────────────────
    let agent = null;

    btnInit.addEventListener('click', async () => {
      clearErr();
      if (!API_KEY || API_KEY === 'your-anthropic-api-key-here') {
        showErr('Set VITE_ANTHROPIC_API_KEY in your .env file (copy sample.env → .env).');
        return;
      }
      btnInit.disabled = true;

      try {
        // ── Create the agent ───────────────────────────────────────────────
        // Three providers, one API key — the simplest possible voice agent.
        agent = new CompositeVoice({
          // NativeSTT uses the browser's built-in Web Speech API. No key needed.
          stt: new NativeSTT({
            language: 'en-US',
            continuous: true,     // keep listening between pauses
            interimResults: true, // stream partial words as you speak
          }),

          // AnthropicLLM calls Claude via HTTP streaming. API key required.
          llm: new AnthropicLLM({
            apiKey: API_KEY,
            model: 'claude-haiku-4-5-20251001',
            systemPrompt: 'You are a helpful voice assistant. Keep responses to two or three sentences.',
            maxTokens: 200,
          }),

          // NativeTTS uses the browser's built-in SpeechSynthesis. No key needed.
          tts: new NativeTTS({
            rate: 1.0,
            preferLocal: true, // prefer on-device voices
          }),
        });

        // ── Subscribe to events ────────────────────────────────────────────
        agent.on('agent.stateChange', (e) => setState(e.state));

        // Show words as they're recognised (partial results)
        agent.on('transcription.interim', (e) => {
          if (e.text.trim()) transcript.innerHTML = `<span class="interim">${e.text}</span>`;
        });

        // Lock in the confirmed transcript once speech ends
        agent.on('transcription.final', (e) => {
          if (e.text.trim()) transcript.textContent = e.text;
        });

        // Clear the response box when LLM generation begins
        agent.on('llm.start', () => { response.innerHTML = ''; });

        // Append each token as it streams in
        agent.on('llm.chunk', (e) => {
          let span = response.querySelector('span.streaming');
          if (!span) { span = document.createElement('span'); span.className = 'streaming'; response.appendChild(span); }
          span.textContent += e.chunk;
        });

        // Remove the streaming highlight once the response is complete
        agent.on('llm.complete', () => { const s = response.querySelector('span.streaming'); if (s) s.className = ''; });

        agent.on('agent.error', (e) => showErr(e.error.message));

        // ── Initialize ─────────────────────────────────────────────────────
        // Connects providers and requests microphone permission.
        await agent.initialize();

        btnStart.disabled = false;
        setState('ready');
      } catch (err) {
        showErr(`Initialization failed: ${err.message}`);
        btnInit.disabled = false;
      }
    });

    btnStart.addEventListener('click', async () => {
      clearErr();
      btnStart.disabled = true;
      try {
        await agent.startListening();
        btnStop.disabled = false;
      } catch (err) {
        showErr(`Start failed: ${err.message}`);
        btnStart.disabled = false;
      }
    });

    btnStop.addEventListener('click', async () => {
      btnStop.disabled = true;
      await agent.stopListening();
      btnStart.disabled = false;
    });
  </script>
</body>
</html>
