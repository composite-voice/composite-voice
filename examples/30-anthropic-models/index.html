<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CompositeVoice — 30 Anthropic Models</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #581c87 0%, #6b21a8 50%, #7e22ce 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }

    .app {
      width: 100%;
      max-width: 640px;
    }

    /* Header */
    header { text-align: center; margin-bottom: 32px; }
    h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
    .tagline { color: #c4b5fd; font-size: 0.875rem; margin-top: 6px; }

    /* Model selector */
    .model-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .model-card {
      position: relative;
      padding: 14px 12px;
      background: rgba(0, 0, 0, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      text-align: center;
    }
    .model-card:hover {
      background: rgba(0, 0, 0, 0.35);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }
    .model-card.active {
      border-color: #a78bfa;
      background: rgba(167, 139, 250, 0.15);
      box-shadow: 0 0 20px rgba(167, 139, 250, 0.2);
    }
    .model-card input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .model-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: #f5f3ff;
      margin-bottom: 4px;
    }
    .model-id {
      font-size: 0.65rem;
      color: #a78bfa;
      font-family: ui-monospace, monospace;
      margin-bottom: 8px;
      word-break: break-all;
    }
    .model-desc {
      font-size: 0.75rem;
      color: #c4b5fd;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    /* Badges */
    .badges {
      display: flex;
      gap: 4px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-radius: 20px;
      white-space: nowrap;
    }
    .badge-speed {
      color: #86efac;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .badge-quality {
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .badge-cost {
      color: #fde68a;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    /* State badge */
    .state-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #334155;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    [data-state="ready"]     .dot { background: #a78bfa; }
    [data-state="listening"] .dot { background: #f59e0b; animation: pulse 1.2s ease-in-out infinite; }
    [data-state="thinking"]  .dot { background: #c084fc; animation: pulse 1.2s ease-in-out infinite; }
    [data-state="speaking"]  .dot { background: #10b981; animation: pulse 1.2s ease-in-out infinite; }
    [data-state="error"]     .dot { background: #ef4444; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    .state-label { font-size: 0.875rem; color: #c4b5fd; }

    /* Latency indicator */
    .latency-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 0.78rem;
      color: #a78bfa;
    }
    .latency-label { font-weight: 600; }
    .latency-value {
      font-family: ui-monospace, monospace;
      color: #e9d5ff;
    }

    /* Controls */
    .controls { display: flex; gap: 8px; margin-bottom: 24px; }
    button {
      flex: 1;
      padding: 10px 16px;
      font-size: 0.875rem;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      color: #e2e8f0;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    #btn-start {
      background: rgba(167, 139, 250, 0.3);
      border-color: rgba(167, 139, 250, 0.5);
    }
    #btn-start:hover:not(:disabled) { background: rgba(167, 139, 250, 0.5); }

    /* Text panels */
    .field { margin-bottom: 16px; }
    .field-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7c3aed;
      margin-bottom: 8px;
    }
    .panel {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 14px 16px;
      min-height: 64px;
      font-size: 0.9rem;
      line-height: 1.65;
      color: #cbd5e1;
    }
    .placeholder { color: #4c1d95; font-style: italic; }
    .interim { color: #7c3aed; }

    /* Error */
    .error {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 8px;
      font-size: 0.85rem;
      color: #fca5a5;
      line-height: 1.5;
    }
    .error.visible { display: block; }

    .hint {
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.2);
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <h1>CompositeVoice</h1>
      <p class="tagline">30 Anthropic Models &mdash; Haiku &middot; Sonnet &middot; Opus</p>
    </header>

    <!-- Model Selector -->
    <div class="model-selector" id="model-selector">
      <label class="model-card active" data-model="claude-haiku-4-5-20251001">
        <input type="radio" name="model" value="claude-haiku-4-5-20251001" checked />
        <div class="model-name">Haiku</div>
        <div class="model-id">claude-haiku-4-5-20251001</div>
        <div class="model-desc">Fast, cost-effective responses for everyday tasks</div>
        <div class="badges">
          <span class="badge badge-speed">Fast</span>
          <span class="badge badge-cost">$0.25/MTok</span>
        </div>
      </label>

      <label class="model-card" data-model="claude-sonnet-4-6-20250514">
        <input type="radio" name="model" value="claude-sonnet-4-6-20250514" />
        <div class="model-name">Sonnet</div>
        <div class="model-id">claude-sonnet-4-6-20250514</div>
        <div class="model-desc">Balanced quality and speed for most use cases</div>
        <div class="badges">
          <span class="badge badge-quality">Balanced</span>
          <span class="badge badge-cost">$3/MTok</span>
        </div>
      </label>

      <label class="model-card" data-model="claude-opus-4-6-20250610">
        <input type="radio" name="model" value="claude-opus-4-6-20250610" />
        <div class="model-name">Opus</div>
        <div class="model-id">claude-opus-4-6-20250610</div>
        <div class="model-desc">Highest quality, most thoughtful and nuanced</div>
        <div class="badges">
          <span class="badge badge-quality">Best</span>
          <span class="badge badge-cost">$15/MTok</span>
        </div>
      </label>
    </div>

    <div id="root" data-state="idle">
      <div class="state-bar">
        <div class="dot"></div>
        <span class="state-label" id="state-label">Idle &mdash; click Initialize</span>
      </div>

      <!-- Latency indicator -->
      <div class="latency-bar">
        <span class="latency-label">First-token latency:</span>
        <span class="latency-value" id="latency-value">&mdash;</span>
      </div>

      <div class="controls">
        <button id="btn-init">Initialize</button>
        <button id="btn-start" disabled>Start</button>
        <button id="btn-stop" disabled>Stop</button>
      </div>

      <div class="field">
        <div class="field-label">You said</div>
        <div class="panel" id="transcript">
          <span class="placeholder">Your words will appear here&hellip;</span>
        </div>
      </div>

      <div class="field">
        <div class="field-label">AI response</div>
        <div class="panel" id="response">
          <span class="placeholder">Claude&rsquo;s reply will stream here&hellip;</span>
        </div>
      </div>

      <div class="error" id="error"></div>
    </div>

    <p class="hint">Chrome or Edge required &middot; Microphone permission needed</p>
  </div>

  <script type="module">
    import {
      CompositeVoice,
      NativeSTT,
      NativeTTS,
      AnthropicLLM,
    } from '@lukeocodes/composite-voice';

    // ─── UI references ─────────────────────────────────────────────────────────
    const root          = document.getElementById('root');
    const stateLabel    = document.getElementById('state-label');
    const btnInit       = document.getElementById('btn-init');
    const btnStart      = document.getElementById('btn-start');
    const btnStop       = document.getElementById('btn-stop');
    const transcript    = document.getElementById('transcript');
    const response      = document.getElementById('response');
    const errorBox      = document.getElementById('error');
    const latencyValue  = document.getElementById('latency-value');
    const modelSelector = document.getElementById('model-selector');
    const modelCards    = modelSelector.querySelectorAll('.model-card');

    const STATE_LABELS = {
      idle:      'Idle \u2014 click Initialize',
      ready:     'Ready \u2014 click Start',
      listening: 'Listening\u2026',
      thinking:  'Thinking\u2026',
      speaking:  'Speaking\u2026',
      error:     'Error \u2014 see below',
    };

    const setUIState = (state) => {
      root.dataset.state = state;
      stateLabel.textContent = STATE_LABELS[state] ?? state;
    };

    const showError = (msg) => {
      errorBox.textContent = msg;
      errorBox.classList.add('visible');
    };

    const clearError = () => errorBox.classList.remove('visible');

    // ─── Model selection ───────────────────────────────────────────────────────
    let selectedModel = 'claude-haiku-4-5-20251001';

    modelCards.forEach((card) => {
      card.addEventListener('click', () => {
        const model = card.dataset.model;
        if (model === selectedModel) return;

        selectedModel = model;

        // Update active card
        modelCards.forEach((c) => c.classList.remove('active'));
        card.classList.add('active');

        // If agent is initialized, dispose and reinitialize with new model
        if (agent) {
          reinitializeWithModel(selectedModel);
        }
      });
    });

    // ─── Agent ─────────────────────────────────────────────────────────────────
    let agent;
    let llmStartTime = 0;
    let firstChunkReceived = false;

    function createAgent(model) {
      return new CompositeVoice({
        stt: new NativeSTT({
          language: 'en-US',
          continuous: true,
          interimResults: true,
        }),

        llm: new AnthropicLLM({
          proxyUrl: `${window.location.origin}/proxy/anthropic`,
          model,
          systemPrompt: 'You are a helpful voice assistant. Keep responses to two or three sentences.',
          maxTokens: 200,
        }),

        tts: new NativeTTS({
          rate: 1.0,
          preferLocal: true,
        }),
      });
    }

    function attachEvents(a) {
      // State changes
      a.on('agent.stateChange', (e) => setUIState(e.state));

      // Transcript: partial words as the user speaks
      a.on('transcription.interim', (e) => {
        if (e.text.trim()) transcript.innerHTML = `<span class="interim">${e.text}</span>`;
      });

      // Transcript: confirmed text
      a.on('transcription.final', (e) => {
        if (e.text.trim()) transcript.textContent = e.text;
      });

      // Latency measurement: record start time and reset flag
      a.on('llm.start', () => {
        llmStartTime = performance.now();
        firstChunkReceived = false;
        response.textContent = '';
        latencyValue.textContent = 'measuring\u2026';
      });

      // Latency measurement: first chunk received, then append all chunks
      a.on('llm.chunk', (e) => {
        if (!firstChunkReceived) {
          firstChunkReceived = true;
          const latencyMs = Math.round(performance.now() - llmStartTime);
          latencyValue.textContent = `${latencyMs} ms`;
        }
        response.textContent += e.chunk;
      });

      // Error reporting
      a.on('agent.error', (e) => showError(e.error.message));
      a.on('llm.error', (e) => showError(`LLM: ${e.error.message}`));
      a.on('tts.error', (e) => showError(`TTS: ${e.error.message}`));

      // Auto-clear errors on recovery
      a.on('agent.stateChange', (e) => {
        if (e.previousState === 'error' && e.state !== 'error') clearError();
      });
    }

    async function reinitializeWithModel(model) {
      clearError();
      btnStart.disabled = true;
      btnStop.disabled = true;
      setUIState('idle');
      stateLabel.textContent = 'Switching model\u2026';
      latencyValue.textContent = '\u2014';

      try {
        // Dispose old agent
        if (agent) {
          await agent.dispose();
          agent = null;
        }

        // Create and initialize new agent
        agent = createAgent(model);
        attachEvents(agent);
        await agent.initialize();
        btnStart.disabled = false;
        setUIState('ready');
      } catch (err) {
        showError(`Reinitialize failed: ${err.message}`);
        setUIState('error');
      }
    }

    // ─── Button handlers ───────────────────────────────────────────────────────
    btnInit.addEventListener('click', async () => {
      clearError();
      btnInit.disabled = true;

      agent = createAgent(selectedModel);
      attachEvents(agent);

      try {
        await agent.initialize();
        btnStart.disabled = false;
        setUIState('ready');
      } catch (err) {
        showError(`Initialization failed: ${err.message}`);
        btnInit.disabled = false;
      }
    });

    btnStart.addEventListener('click', async () => {
      clearError();
      btnStart.disabled = true;
      try {
        await agent.startListening();
        btnStop.disabled = false;
      } catch (err) {
        showError(`Could not start: ${err.message}`);
        btnStart.disabled = false;
      }
    });

    btnStop.addEventListener('click', async () => {
      btnStop.disabled = true;
      await agent.stopListening();
      btnStart.disabled = false;
    });
  </script>
</body>
</html>
